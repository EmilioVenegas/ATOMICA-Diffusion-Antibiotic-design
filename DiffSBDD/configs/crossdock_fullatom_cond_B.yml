run_name: 'condB_static_t_r0'
logdir: './my_logs'
wandb_params:
  mode: 'online'
  entity: 'emiliovenegas10-tecnol-gico-de-monterrey'
  group: 'atomica-crossdocked'
  project: 'atomica-enhanced'

dataset: 'crossdock'
datadir: 'data/processed_expert_atomica'
enable_progress_bar: True
num_sanity_val_steps: 0

mode: 'pocket_conditioning'
pocket_representation: 'full-atom'

# --- Condition B: adapter-only, backbone frozen, static t (no timestep-adaptive) ---
batch_size: 2
accumulate_grad_batches: 16       # effective batch = 32
lr: 1.0e-5                        # backbone LR (ignored: backbone is frozen)
adapter_lr: 1.0e-4                # adapter LR — higher than backbone to compensate
freeze_backbone: True
n_epochs: 50
val_check_interval: 200           # validate every 200 steps (not every epoch)

noise_factor: 1.0
num_workers: 8
gpus: 1
clip_grad: True
augment_rotation: False
augment_noise: 0
precision: bf16-mixed
compile: false

auxiliary_loss: False
loss_params:
  max_weight: 0.001
  schedule: 'linear'
  clamp_lj: 3.0

egnn_params:
  device: 'cuda'
  edge_cutoff_ligand: null
  edge_cutoff_pocket: 5.0
  edge_cutoff_interaction: 5.0n
  reflection_equivariant: False
  joint_nf: 128
  hidden_nf: 256
  n_layers: 6
  attention: True
  tanh: True
  norm_constant: 1
  inv_sublayers: 1
  sin_embedding: False
  aggregation_method: 'sum'
  normalization_factor: 100
  atomica_nf: 32
  lora_rank: 0                    # no LoRA for condition B
  lora_alpha: 16
  timestep_adaptive: False        # static t — adapter query ignores denoising step
  gradient_checkpointing: True    # required for RTX 4060 8GB with full-atom pockets

diffusion_params:
  diffusion_steps: 500
  diffusion_noise_schedule: 'polynomial_2'
  diffusion_noise_precision: 5.0e-4
  diffusion_loss_type: 'l2'
  normalize_factors: [1, 4]

eval_epochs: 5
visualize_sample_epoch: 10
visualize_chain_epoch: 50
eval_params:
  n_eval_samples: 50
  eval_batch_size: 50
  smiles_file: 'data/crossdocked_smiles.npy'
  n_visualize_samples: 3
  keep_frames: 100
#  Is freezing okay?

# As a first experiment: yes. 90K trainable params trains fast and won't overfit. If the adapter works at all, you'll see it in wandb within the first few hundred steps (adapter/scale leaving 0.01, adapter/attn_entropy_mean showing variation).

# As a final model: probably not enough. Condition D (LoRA) is the right follow-up — it lets the EGNN's internal feature processing adapt to ATOMICA-modified inputs without full fine-tuning, so the coordinate update network learns to act on the new feature distribution rather than ignoring it.

# The ablation you've set up (A → B → C → D) tests exactly this progression: does any ATOMICA signal help (B vs A), does timestep awareness help (C vs B), and does backbone adaptation help (D vs C). That's a clean story.

