run_name: 'condD_lora_r0'
logdir: './my_logs'
wandb_params:
  mode: 'offline'
  entity: 'emiliovenegas10-tecnol-gico-de-monterrey'
  group: 'atomica-crossdocked'
  project: 'atomica-enhanced'

dataset: 'crossdock'
datadir: 'data/processed_expert_atomica'
enable_progress_bar: True
num_sanity_val_steps: 0

mode: 'pocket_conditioning'
pocket_representation: 'full-atom'

# --- Condition D: LoRA fine-tuning of backbone + ATOMICA adapter ---
batch_size: 2
accumulate_grad_batches: 16       # effective batch = 32
lr: 1.0e-5
adapter_lr: 1.0e-4
freeze_backbone: False            # backbone unfrozen; LoRA controls capacity
n_epochs: 50
early_stop_patience: 5
val_check_interval: 200

noise_factor: 1.0
num_workers: 8
gpus: 1
clip_grad: True
augment_rotation: False
augment_noise: 0
precision: bf16-mixed
compile: false

auxiliary_loss: False
loss_params:
  max_weight: 0.001
  schedule: 'linear'
  clamp_lj: 3.0

egnn_params:
  device: 'cuda'
  edge_cutoff_ligand: null
  edge_cutoff_pocket: 5.0
  edge_cutoff_interaction: 5.0
  reflection_equivariant: False
  joint_nf: 128
  hidden_nf: 256
  n_layers: 6
  attention: True
  tanh: True
  norm_constant: 1
  inv_sublayers: 1
  sin_embedding: False
  aggregation_method: 'sum'
  normalization_factor: 100
  atomica_nf: 32
  lora_rank: 8                    # LoRA rank for EGNN linear layers
  lora_alpha: 16
  timestep_adaptive: True
  gradient_checkpointing: True

diffusion_params:
  diffusion_steps: 500
  diffusion_noise_schedule: 'polynomial_2'
  diffusion_noise_precision: 5.0e-4
  diffusion_loss_type: 'l2'
  normalize_factors: [1, 4]

eval_epochs: 5
visualize_sample_epoch: 10
visualize_chain_epoch: 50
eval_params:
  n_eval_samples: 50
  eval_batch_size: 50
  smiles_file: 'data/crossdocked_smiles.npy'
  n_visualize_samples: 3
  keep_frames: 100
