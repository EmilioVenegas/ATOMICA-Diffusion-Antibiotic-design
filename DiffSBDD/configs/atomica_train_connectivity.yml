run_name: 'pocketcoords-connectivity-v2'
logdir: './my_logs'
wandb_params:
  mode: 'online'
  entity: 'emiliovenegas10-tecnol-gico-de-monterrey'
  group: 'atomica'
  project: 'atomica-enhanced'

dataset: 'atomica_PL'
datadir: data/processed_atomica_filtered2/
atomica_model_config: ATOMICA/pretrain/pretrain_model_config.json
atomica_model_weights: ATOMICA/pretrain/pretrain_model_weights.pt
enable_progress_bar: True
num_sanity_val_steps: 0

# --- MODEL AND TRAINING PARAMS ---
mode: 'pocket_conditioning'
pocket_representation: 'atomica'
batch_size: 24 # Reduced batch size due to larger model
lr: 1.0e-4 
n_epochs: 1000
num_workers: 8
gpus: 1
strategy: 'auto'
clip_grad: True
augment_rotation: False
warmup_steps: 500

augment_noise: 0.001
accumulate_grad_batches: 8
gradient_clip_algorithm: 'norm'
gradient_clip_val: 0.1

# parameter to prioritize geometry
coord_loss_weight: 1.0 # Rebalanced to prevent over-emphasis on coords vs atom types

auxiliary_loss: False
loss_params:
  max_weight: 0.0001
  schedule: 'linear'
  clamp_lj: 100.0

bond_params:
  enabled: False # DISABLED - bond potential was creating disconnected fragments
  max_weight: 0.1  
  target_length: 1.5  # Average covalent bond length
  cutoff_radius: 2.0  # Only apply to close atoms
  clamp_b: 5.0       

# --- EGNN (DYNAMICS) PARAMS ---
egnn_params:
  #context_nf: 512
  device: 'cuda'
  edge_cutoff_ligand: null
  edge_cutoff_interaction: 7.0
  reflection_equivariant: True
  atomica_embed_dim: 32 # Reverted to 32 to match data
  atomica_one_hot_dim: 9
  hidden_nf: 256 # INCREASED from 128
  n_layers: 6
  attention: True
  tanh: True
  coords_range: 10.0
  norm_constant: 1.0
  inv_sublayers: 1
  sin_embedding: False
  aggregation_method: 'mean' 
  normalization_factor: 1 
  edge_embedding_dim: 32

# --- DIFFUSION PARAMS ---
diffusion_params:
  diffusion_steps: 500
  diffusion_noise_schedule: 'polynomial_2'
  diffusion_noise_precision: 1.0e-4
  diffusion_loss_type: 'l2'
  normalize_factors: [1.0, 1.0]

# --- EVALUATION PARAMS ---
eval_epochs: 50
visualize_sample_epoch: 50
visualize_chain_epoch: 50
eval_params:
  n_eval_samples: 100
  eval_batch_size: 4
  smiles_file: null
  n_visualize_samples: 5
  keep_frames: 100
